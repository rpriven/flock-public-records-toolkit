<!-- Source for assets/social-preview.jpg (GitHub social preview, 1280x640). Open beside hero.jpg at a 1280x640 viewport and screenshot. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>card</title>
<style>
  html,body{margin:0;background:#0d0716}
  .card{position:relative;width:1280px;height:640px;overflow:hidden;font-family:'Courier New',ui-monospace,Menlo,monospace;color:#e8e2d6}
  .bg{position:absolute;inset:0;background:url(hero.jpg) center/cover no-repeat}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,7,22,.90) 0%,rgba(13,7,22,.72) 40%,rgba(13,7,22,.2) 68%,rgba(13,7,22,0) 100%)}
  .rule{position:absolute;left:88px;top:176px;width:56px;height:3px;background:#f2a54a;box-shadow:0 0 14px rgba(242,165,74,.8)}
  .text{position:absolute;left:88px;top:196px;width:640px}
  h1{margin:0;font-size:58px;line-height:1.05;letter-spacing:2px;color:#f7d9a8;text-shadow:0 0 18px rgba(242,165,74,.55),0 0 50px rgba(242,165,74,.25);font-weight:bold}
  h1 small{display:block;font-size:30px;letter-spacing:6px;color:#f2a54a;margin-bottom:6px}
  .tag{margin-top:18px;color:#c9b8e8;font-size:21px;letter-spacing:1px;line-height:1.5}
  .tag b{color:#e8e2d6;font-weight:normal}
  .chip{display:inline-block;margin:24px 8px 0 0;padding:6px 12px;border:1px solid rgba(242,165,74,.55);border-radius:5px;color:#f7d9a8;font-size:15px;letter-spacing:2px;background:rgba(13,7,22,.6)}
  .foot{position:absolute;left:88px;bottom:40px;color:#9a8fb5;font-size:15px;letter-spacing:1px}
</style></head><body>
<div class="card">
  <div class="bg"></div><div class="shade"></div>
  <div class="rule"></div>
  <div class="text">
    <h1><small>FLOCK SAFETY</small>Public Records<br>Request Toolkit</h1>
    <div class="tag"><b>Ask your town what the cameras are doing.</b><br>Correct citations and deadlines, 20 states.<br>Browser app, CLI, or copy-paste template.</div>
    <span class="chip">NO INSTALL</span><span class="chip">NOTHING SENT</span><span class="chip">OPEN SOURCE</span>
  </div>
  <div class="foot">github.com/rpriven/flock-public-records-toolkit</div>
</div>
</body></html>
